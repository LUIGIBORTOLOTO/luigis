<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuiGIS 1.0.0 - Sistema CAD & GIS Profissional</title>
    
    <!-- Leaflet & Geoman CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.0/dist/leaflet-geoman.css" />
    
    <!-- Google Fonts & Tailwind styling helpers -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f0f11;
            --bg-panel: #18181b;
            --bg-hover: #27272a;
            --border-color: #3f3f46;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* Loader com fundo escuro fixo */
        #loader-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f0f11;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s ease;
        }

        .loader-logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Main Workspace layout */
        .x-ws {
            display: grid;
            grid-template-rows: 40px 35px 1fr 24px;
            grid-template-columns: 280px 1fr 300px;
            grid-template-areas:
                "ribbon ribbon ribbon"
                "toolbar toolbar toolbar"
                "leftmap center rightprop"
                "status status status";
            width: 100vw;
            height: 100vh;
            transition: grid-template-columns 0.3s ease;
        }

        /* Estados de fechamento das sidebars (nl = no left, nr = no right) */
        .x-ws.nl {
            grid-template-columns: 0px 1fr 300px;
        }
        .x-ws.nr {
            grid-template-columns: 280px 1fr 0px;
        }
        .x-ws.nl.nr {
            grid-template-columns: 0px 1fr 0px;
        }

        .x-ribbon {
            grid-area: ribbon;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 15px;
            z-index: 1000;
        }

        .brand {
            font-weight: 700;
            font-size: 14px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ribbon-tabs {
            display: flex;
            gap: 5px;
            height: 100%;
            align-items: flex-end;
        }

        .rtab {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-top: 2px solid transparent;
        }

        .rtab.active, .rtab:hover {
            color: var(--text-main);
            background: var(--bg-hover);
            border-top-color: var(--accent);
        }

        .x-toolbar {
            grid-area: toolbar;
            background: #121215;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 8px;
            z-index: 999;
        }

        .t-group {
            display: flex;
            align-items: center;
            gap: 4px;
            border-right: 1px solid var(--border-color);
            padding-right: 8px;
        }

        .t-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .t-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-color);
        }

        .x-center {
            grid-area: center;
            position: relative;
            background: #09090b;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Grid CAD visível por padrão */
        #x-grid {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            display: block;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .x-left {
            grid-area: leftmap;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            z-index: 900;
            transition: transform 0.3s ease;
        }

        .x-right {
            grid-area: rightprop;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            z-index: 900;
        }

        .panel-header {
            padding: 10px 15px;
            font-size: 12px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Basemap selection styling */
        .x-ly {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
            cursor: pointer;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .x-ly:hover {
            background: var(--bg-hover);
        }

        .x-ly.on {
            background: rgba(59, 130, 246, 0.15);
            border-left: 3px solid var(--accent);
        }

        .sw {
            width: 24px;
            height: 18px;
            border-radius: 3px;
        }

        .nm {
            flex: 1;
        }

        .x-status {
            grid-area: status;
            background: #121215;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 11px;
            color: var(--text-muted);
            z-index: 1000;
        }

        /* Utility toggle buttons */
        .tg.open {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div id="loader-screen">
        <div class="loader-logo">LuiGIS CAD</div>
        <div class="spinner"></div>
    </div>

    <div class="x-ws nl nr" id="x-ws">
        
        <!-- Ribbon Header Menu -->
        <div class="x-ribbon">
            <div class="brand">⚡ LuiGIS</div>
            <div class="ribbon-tabs">
                <div class="rtab active">Início</div>
                <div class="rtab">Desenho CAD</div>
                <div class="rtab">Topografia</div>
                <div class="rtab">Análise GIS</div>
                <div class="rtab">Configurações</div>
            </div>
        </div>

        <!-- Secondary Toolbar / Action Bar -->
        <div class="x-toolbar">
            <div class="t-group">
                <button class="tg" id="x-tl" title="Camadas" onclick="toggleSidebar('left')">◧</button>
                <button class="tg" id="x-tr" title="Propriedades" onclick="toggleSidebar('right')">◨</button>
            </div>
            <div class="t-group">
                <button class="t-btn" onclick="map.pm.enableDraw('Line')">╱ Linha</button>
                <button class="t-btn" onclick="map.pm.enableDraw('Polygon')">⌇ Polígono</button>
                <button class="t-btn" onclick="map.pm.enableDraw('Circle')">○ Círculo</button>
                <button class="t-btn" onclick="ativarDesenhoBloco()">📍 Inserir Bloco</button>
            </div>
        </div>

        <!-- Left Sidebar: Layers & Basemaps -->
        <div class="x-left" id="panel-left">
            <div class="panel-header">Gerenciador de Camadas & Fundo</div>
            <div style="padding: 10px; font-size:11px; color:var(--text-muted);">Basemaps</div>
            
            <!-- Fundo CAD selecionado por padrão (classe .on) -->
            <div class="x-ly x-bm on" onclick="setBasemap('cad',this)">
                <span style="opacity:1">👁</span>
                <span class="sw" style="background:#444"></span>
                <span class="nm">Fundo CAD (quadrantes)</span>
                <span></span><span></span>
            </div>
            
            <div class="x-ly x-bm" onclick="setBasemap('googleHybrid',this)">
                <span style="opacity:0.3">👁</span>
                <span class="sw" style="background:#2e7d32"></span>
                <span class="nm">Google Híbrido</span>
                <span></span><span></span>
            </div>
        </div>

        <!-- Center Area: Leaflet Map & CAD Grid -->
        <div class="x-center">
            <div id="x-grid"></div>
            <div id="map"></div>
        </div>

        <!-- Right Sidebar: Properties & Inspector -->
        <div class="x-right" id="panel-right">
            <div class="panel-header">Propriedades do Objeto</div>
            <div style="padding: 15px; font-size:12px; color:var(--text-muted);">
                Nenhum elemento selecionado no canvas CAD.
            </div>
        </div>

        <!-- Status Bar -->
        <div class="x-status">
            <div id="coords-status">Coordenadas: Lat: 0.0000, Lng: 0.0000</div>
            <div>LuiGIS Engine v1.0.0 | Modo CAD Ativo</div>
        </div>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.0/dist/leaflet-geoman.min.js"></script>

    <script>
        
        // Inicializa o mapa Leaflet com array de camadas vazio (sem carregar satélite pesado de início)
        const map = L.map('map', {
            center: [-19.9167, -43.9345], // Belo Horizonte
            zoom: 15,
            layers: [],
            zoomControl: false
        });

        // Camada base do Google Híbrido disponível caso o usuário queira alternar
        const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0','mt1','mt2','mt3']
        });

        // Configuração do Leaflet-Geoman para ferramentas de desenho CAD
        map.pm.addControls({
            position: 'topright',
            drawPolygon: true,
            drawMarker: true,
            drawCircleMarker: false,
            drawPolyline: true,
            drawRectangle: true,
            drawCircle: true,
            editMode: true,
            removalMode: true,
        });

        map.pm.setLang('pt_br');

        // Função para alternar o Basemap (CAD vs Satélite)
        function setBasemap(type, el) {
            document.querySelectorAll('.x-bm').forEach(item => item.classList.remove('on'));
            el.classList.add('on');

            if (type === 'googleHybrid') {
                if (!map.hasLayer(googleHybrid)) map.addLayer(googleHybrid);
                document.getElementById('x-grid').style.display = 'none';
            } else {
                if (map.hasLayer(googleHybrid)) map.removeLayer(googleHybrid);
                document.getElementById('x-grid').style.display = 'block';
            }
        }

        // Função para alternar as abas laterais (Sidebars)
        function toggleSidebar(side) {
            const ws = document.getElementById('x-ws');
            if (side === 'left') {
                ws.classList.toggle('nl');
                document.getElementById('x-tl').classList.toggle('open');
            } else if (side === 'right') {
                ws.classList.toggle('nr');
                document.getElementById('x-tr').classList.toggle('open');
            }
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // Função auxiliar para ativar Blocos
        function ativarDesenhoBloco() {
            map.pm.disableDraw();
            alert('Modo de inserção de bloco ativado. Clique no mapa.');
        }

        // Atualizador de coordenadas na barra de status
        map.on('mousemove', (e) => {
            const { lat, lng } = e.latlng;
            document.getElementById('coords-status').innerText = `Coordenadas: Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }, 600);
        });
    </script>
</body>
</html>
